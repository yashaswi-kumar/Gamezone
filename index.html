<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameZone</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#080b14;color:white}
nav{padding:18px 7%;background:#111629;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:bold;color:#00e5ff}
nav a{color:white;text-decoration:none;margin-left:20px}
.hero{text-align:center;padding:80px 20px;background:linear-gradient(135deg,#15134a,#082d42)}
.hero h1{font-size:55px;margin:10px}
.hero span{color:#00e5ff}
.hero p{color:#b8c0d5;font-size:18px}
.btn{padding:13px 25px;border:0;border-radius:10px;background:#7c5cff;color:white;font-weight:bold;cursor:pointer}
section{max-width:1100px;margin:auto;padding:55px 20px}
h2{text-align:center;font-size:32px}
.search{display:block;margin:20px auto;padding:13px;width:min(400px,100%);
border-radius:10px;border:1px solid #39435d;background:#111827;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#141a2b;border:1px solid #29334d;border-radius:16px;overflow:hidden;text-align:center}
.pic{height:150px;display:grid;place-items:center;font-size:60px;background:linear-gradient(135deg,#39216b,#123b50)}
.card h3{margin:18px 0 5px}
.card p{color:#9ca7c2}
.play{margin:10px 0 20px;padding:10px 25px;border:0;border-radius:8px;background:#00bcd4;color:white;font-weight:bold;cursor:pointer}
footer{text-align:center;padding:30px;color:#7f8aa5;border-top:1px solid #222b40}
</style>
</head>

<body>

<nav>
<div class="logo">🎮 GAMEZONE</div>
<div>
<a href="#home">Home</a>
<a href="#games">Games</a>
</div>
</nav>

<div class="hero" id="home">
<h1>Welcome to <span>GameZone</span></h1>
<p>Play fun browser games instantly.</p>
<button class="btn" onclick="document.getElementById('games').scrollIntoView()">Explore Games</button>
</div>

<section id="games">
<h2>🎮 Featured Games</h2>

<input class="search" id="search" placeholder="Search games..." oninput="searchGames()">

<div class="grid" id="gameList">

<div class="card" data-name="Neon Runner">
<div class="pic">🏃</div>
<h3>Neon Runner</h3>
<p>Arcade</p>
<button class="play" onclick="play('Neon Runner')">PLAY NOW</button>
</div>

<div class="card" data-name="Space Blaster">
<div class="pic">🚀</div>
<h3>Space Blaster</h3>
<p>Action</p>
<button class="play" onclick="play('Space Blaster')">PLAY NOW</button>
</div>

<div class="card" data-name="Cyber Racing">
<div class="pic">🏎️</div>
<h3>Cyber Racing</h3>
<p>Racing</p>
<button class="play" onclick="play('Cyber Racing')">PLAY NOW</button>
</div>

<div class="card" data-name="Block Puzzle">
<div class="pic">🧩</div>
<h3>Block Puzzle</h3>
<p>Puzzle</p>
<button class="play" onclick="play('Block Puzzle')">PLAY NOW</button>
</div>

<div class="card" data-name="Galaxy Quest">
<div class="pic">🌌</div>
<h3>Galaxy Quest</h3>
<p>Adventure</p>
<button class="play" onclick="play('Galaxy Quest')">PLAY NOW</button>
</div>

<div class="card" data-name="Dungeon Dash">
<div class="pic">⚔️</div>
<h3>Dungeon Dash</h3>
<p>Action</p>
<button class="play" onclick="play('Dungeon Dash')">PLAY NOW</button>
</div>

</div>
</section>

<footer>
© 2026 GameZone • Gaming Website
</footer>

<script>
function play(game){
alert("🎮 "+game+" is starting!\n\nYour game will open here.");
}

function searchGames(){
let q=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".card").forEach(card=>{
card.style.display=card.dataset.name.toLowerCase().includes(q)?"block":"none";
});
}
</script>

</body>
  </html>
